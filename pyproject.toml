[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rudriq"
version = "0.1.0.dev7"
description = "Connect LLM behavior to its upstream data lineage. Operation-level root-cause analysis across data pipelines and LLM calls."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kishan Raj VG", email = "kishanraj41@gmail.com"},
]
keywords = [
    "observability",
    "llm",
    "data-lineage",
    "opentelemetry",
    "openllmetry",
    "autolineage",
    "rag",
    "ai-debugging",
    "root-cause-analysis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
    "duckdb>=0.10.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
llm = [
    "traceloop-sdk>=0.30",
    # Pinned to a tested OpenAI SDK range. Our auto_capture module
    # monkey-patches openai.resources.embeddings.Embeddings.create and
    # openai.resources.chat.completions.Completions.create — internals
    # the SDK occasionally reshapes between minor versions.
    "openai>=1.0,<2.0",
]
lineage = [
    # Auto-registration of object identity into the linker requires
    # the register_assign_id_callback API added in autolineage 0.5,
    # and the post_record callback added in 0.6. Published to PyPI as
    # 0.6.1 on 2026-05-15; the git-URL pin below is retired.
    "autolineage>=0.6.1,<0.7",
]
evaluate = [
    # Semantic evaluators (retrieval_relevance, groundedness) need
    # sentence embeddings. fastembed gives BAAI/bge-small-en-v1.5 via
    # ONNX runtime (~130MB) — same quality as sentence-transformers but
    # without dragging in torch (~2GB). Architectural commitment: the
    # core install stays lean; evaluators that need embeddings degrade
    # gracefully when this extra is not installed.
    "fastembed>=0.3,<1.0",
    "numpy>=1.24",
]
all = [
    "traceloop-sdk>=0.30",
    "openai>=1.0,<2.0",
    "autolineage>=0.6.1,<0.7",
    "fastembed>=0.3,<1.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
rudriq = "rudriq.cli:main"

[project.urls]
Homepage = "https://github.com/kishanraj41/rudriq"
Repository = "https://github.com/kishanraj41/rudriq"
Issues = "https://github.com/kishanraj41/rudriq/issues"

[tool.setuptools.packages.find]
include = ["rudriq*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]